name: Code quality

on:
  workflow_call:
    secrets:
      npm-token: { required: true }

permissions:
  packages: read

concurrency:
  group: code-quality-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Pull repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: npm
          cache-dependency-path: ./package-lock.json
          registry-url: "https://npm.pkg.github.com"
          scope: "@govuk-one-login"
          always-auth: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm-token }}

      - name: Run pre-commit
        uses: govuk-one-login/github-actions/code-quality/run-pre-commit@b5f4f92a0692bf297b08c43745e545e45631f0ee
        with:
          all-files: true
          pull-repository: false
          install-dependencies: true

  linting:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - name: Pull repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 17
          distribution: zulu
          cache: gradle

      - name: Run Spotless
        run: ./gradlew --no-daemon spotlessCheck
